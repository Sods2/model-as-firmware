<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 275" width="860" height="275" role="img" aria-label="Train a ternary model (PyTorch, on the PC), then the model compiler (Python, to build) produces a firmware image that is the model, for the Pico 2 now. Later the compiler also targets a bare-metal Pi 4 / Pi 5 and an FPGA via QONNX + hls4ml / FINN."><title>Train a ternary model (PyTorch, on the PC), then the model compiler (Python, to build) produces a firmware image that is the model, for the Pico 2 now. Later the compiler also targets a bare-metal Pi 4 / Pi 5 and an FPGA via QONNX + hls4ml / FINN.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;fill:#e6edf3}.pt{font-size:14px;font-weight:700}.ps{font-size:12px;fill:#9198a1}.nt{font-size:14px;font-weight:600;text-anchor:middle}.ni{font-size:13px;font-style:italic;text-anchor:middle;fill:#9198a1}.ns{font-size:12px;text-anchor:middle;fill:#9198a1}.el{font-size:11.5px;font-style:italic;stroke-width:4px;stroke-linejoin:round;paint-order:stroke}</style><defs><marker id="ah-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#7d8590"/></marker><marker id="ah-build" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#7d95f0"/></marker><marker id="ah-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#e9a94a"/></marker><marker id="ah-hw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#4cc488"/></marker><marker id="ah-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" m