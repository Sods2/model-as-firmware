<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 270" width="936" height="270" role="img" aria-label="The compiler splits a trained ternary model three ways: layer order, loops, addresses and activations become code in SRAM; small hot weights such as tree router nodes become instructions; bulk weights stay packed 2-bit as data in flash, loaded and unpacked at run time. Both feed the code in SRAM."><title>The compiler splits a trained ternary model three ways: layer order, loops, addresses and activations become code in SRAM; small hot weights such as tree router nodes become instructions; bulk weights stay packed 2-bit as data in flash, loaded and unpacked at run time. Both feed the code in SRAM.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;fill:#e6edf3}.pt{font-size:14px;font-weight:700}.ps{font-size:12px;fill:#9198a1}.nt{font-size:14px;font-weight:600;text-anchor:middle}.ni{font-size:13px;font-style:italic;text-anchor:middle;fill:#9198a1}.ns{font-size:12px;text-anchor:middle;fill:#9198a1}.el{font-size:11.5px;font-style:italic;stroke-width:4px;stroke-linejoin:round;paint-order:stroke}</style><defs><marker id="ah-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#7d8590"/></marker><marker id="ah-build" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#7d95f0"/></marker><marker id="ah-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#e9a94a"/></marker><marker id="ah-hw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#4cc488"/></marker><marker id="ah-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#e9a94a"/></marker><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#8b949e"/></marker><marker id="ah-decide" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#a78bfa"/></marker><marker id="ah-future" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#8b949e"/></marker><marker id="ah-note" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#3d444d"/></marker></defs><path d="M206 152 L246 152" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M366 152 L756 152" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M306 132 L306 90 Q306 82 314 82 L486 82" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M306 172 L306 214 Q306 222 314 222 L486 222" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M696 82 L828 82 Q836 82 836 90 L836 132" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M696 222 L828 222 Q836 222 836 214 L836 172" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><g class="n" data-id="M"><rect x="16" y="132" width="190" height="40" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/><text x="111" y="156.5" class="nt">Trained ternary model</text></g><g class="n" data-id="C"><rect x="246" y="132" width="120" height="40" rx="20" fill="#221a38" stroke="#a78bfa" stroke-width="1.5"/><text x="306" y="156.5" class="nt">Compiler</text></g><g class="n" data-id="HOT"><rect x="486" y="62" width="210" height="40" rx="8" fill="#161f36" stroke="#7d95f0" stroke-width="1.5"/><text x="591" y="86.5" class="nt">Weights as instructions</text></g><g class="n" data-id="DATA"><rect x="486" y="202" width="210" height="40" rx="8" fill="#2a2113" stroke="#e9a94a" stroke-width="1.5"/><text x="591" y="226.5" class="nt">Data in flash</text></g><g class="n" data-id="CODE"><rect x="756" y="132" width="160" height="40" rx="8" fill="#122a1f" stroke="#4cc488" stroke-width="1.5"/><text x="836" y="156.5" class="nt">Code in SRAM</text></g><text x="561" y="145.0" text-anchor="middle" class="el" fill="#9198a1" stroke="#0d1117">layer order, loops, addresses, activations</text><text x="396" y="54.0" text-anchor="middle" class="el" fill="#9198a1" stroke="#0d1117">small hot weights,</text><text x="396" y="68.5" text-anchor="middle" class="el" fill="#9198a1" stroke="#0d1117">e.g. tree router nodes</text><text x="396" y="241.0" text-anchor="middle" class="el" fill="#9198a1" stroke="#0d1117">bulk weights,</text><text x="396" y="255.5" text-anchor="middle" class="el" fill="#9198a1" stroke="#0d1117">packed 2-bit</text><text x="846" y="196.0" text-anchor="start" class="el" fill="#9198a1" stroke="#0d1117">load + unpack</text><text x="846" y="210.5" text-anchor="start" class="el" fill="#9198a1" stroke="#0d1117">at run time</text></svg>
