<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 914 291" width="914" height="291" role="img" aria-label="Six phases, each ending in a gate. Phase 0: train ternary MNIST (reuse BitNetMCU). Phase 1: compile to Pico 2 firmware vs the CMSIS-NN baseline. Phase 2: dual core, DMA, PIO plus ideas A-D. Phase 3: tiny story LM on the Pico, beat Atome at about 1 tok/s. Phase 4: bare-metal Pi 4 / Pi 5, larger models, storage tier. Phase 5: FPGA via QONNX + hls4ml / FINN."><title>Six phases, each ending in a gate. Phase 0: train ternary MNIST (reuse BitNetMCU). Phase 1: compile to Pico 2 firmware vs the CMSIS-NN baseline. Phase 2: dual core, DMA, PIO plus ideas A-D. Phase 3: tiny story LM on the Pico, beat Atome at about 1 tok/s. Phase 4: bare-metal Pi 4 / Pi 5, larger models, storage tier. Phase 5: FPGA via QONNX + hls4ml / FINN.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;fill:#e6edf3}.pt{font-size:14px;font-weight:700}.ps{font-size:12px;fill:#9198a1}.nt{font-size:14px;font-weight:600;text-anchor:middle}.ni{font-size:13px;font-style:italic;text-anchor:middle;fill:#9198a1}.ns{font-size:12px;text-anchor:middle;fill:#9198a1}.el{font-size:11.5px;font-style:italic;stroke-width:4px;stroke-linejoin:round;paint-order:stroke}</style><defs><marker id="ah-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#7d8590"/></marker><marker id="ah-build" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#7d95f0"/></marker><marker id="ah-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#e9a94a"/></marker><marker id="ah-hw" viewBox="0 0 10 10" refX="9" refY="5" mark