<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 310" width="944" height="310" role="img" aria-label="Idea test order after Phase 1: A (code vs data split), then C (DMA streaming), then B (tree-routed neurons, the most novel). B leads to D (early exit), H (prompt batching) and G (SRAM cache over flash). D leads to F (split layers across 3 Picos). G and H lead to the larger-than-memory goal on a Pi 4 with a USB SSD. E (lookup-table maths) only if time."><title>Idea test order after Phase 1: A (code vs data split), then C (DMA streaming), then B (tree-routed neurons, the most novel). B leads to D (early exit), H (prompt batching) and G (SRAM cache over flash). D leads to F (split layers across 3 Picos). G and H lead to the larger-than-memory goal on a Pi 4 with a USB SSD. E (lookup-table maths) only if time.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;fill:#1f2328}.pt{font-size:14px;font-weight:700}.ps{font-size:12px;fill:#59636e}.nt{font-size:14px;font-weight:600;text-anchor:middle}.ni{font-size:13px;font-style:italic;text-anchor:middle;fill:#59636e}.ns{font-size:12px;text-anchor:middle;fill:#59636e}.el{font-size:11.5px;font-style:italic;stroke-width:4px;stroke-linejoin:round;paint-order:stroke}</style><defs><marker id="ah-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#818b98"/></marker><marker id="ah-build" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#4f6bd8"/></marker><marker id="ah-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#d08a1e"/></marker><marker id="ah-hw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth=