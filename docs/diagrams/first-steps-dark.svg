<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 590" width="912" height="590" role="img" aria-label="Phase 0 and Phase 1 step by step. 1: toolchain (Pico SDK, arm-none-eabi-gcc, picotool, OpenOCD). 2: blink and UART hello on the Pico 2 via the Debug Probe. 3: reproduce BitNetMCU, training ternary MNIST on the PC. 4: plain-C reference inference on the Pico 2 (packed weights). 5: CMSIS-NN int8 baseline, same task. 6: test harness, a PC script comparing board and PyTorch. Gate 0: board output equals PyTorch and baseline numbers logged? 7: compiler v0, model to C per layer. 8: idea A, three builds (all-code, all-data, hybrid). Gate 1: beats CMSIS-NN at equal accuracy?"><title>Phase 0 and Phase 1 step by step. 1: toolchain (Pico SDK, arm-none-eabi-gcc, picotool, OpenOCD). 2: blink and UART hello on the Pico 2 via the Debug Probe. 3: reproduce BitNetMCU, training ternary MNIST on the PC. 4: plain-C reference inference on the Pico 2 (packed weights). 5: CMSIS-NN int8 baseline, same task. 6: test harness, a PC script comparing board and PyTorch. Gate 0: board output equals PyTorch and baseline numbers logged? 7: compiler v0, model to C per layer. 8: idea A, three builds (all-code, all-data, hybrid). Gate 1: beats CMSIS-NN at equal accuracy?</title><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;fill:#e6edf3}.pt{font-size:14px;font-weight:700}.ps{font-size:12px;fill:#9198a1}.nt{font-size:14px;font-weight:600;text-anchor:middle}.ni{font-size:13px;font-style:italic;text-anchor:middle;fill:#9198a1}.ns{font-size:12px;text-anchor:middle;fill:#9198a1}.el{font-size:11.5px;font-style:italic;stroke-width:4px;stroke-linejoin:round;paint-order:stroke}</style><defs><marker id="ah-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#7d8590"/></marker><marker id="ah-build" viewBox="0 0 10 10" refX=