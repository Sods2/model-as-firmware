<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 472" width="912" height="472" role="img" aria-label="Pipeline, one layer group per board: board 1 has layers 1-4, board 2 layers 5-8, board 3 layers 9-12, board 4 layers 13-16; one token visits the boards in turn while the others wait, which adds capacity, not speed. Split layer, every board holds a slice of every layer: a coordinator (input, output, next token) feeds four boards each holding a quarter of the neurons, and they exchange small result vectors back, one message per layer."><title>Pipeline, one layer group per board: board 1 has layers 1-4, board 2 layers 5-8, board 3 layers 9-12, board 4 layers 13-16; one token visits the boards in turn while the others wait, which adds capacity, not speed. Split layer, every board holds a slice of every layer: a coordinator (input, output, next token) feeds four boards each holding a quarter of the neurons, and they exchange small result vectors back, one message per layer.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;fill:#1f2328}.pt{font-size:14px;font-weight:700}.ps{font-size:12px;fill:#59636e}.nt{font-size:14px;font-weight:600;text-anchor:middle}.ni{font-size:13px;font-style:italic;text-anchor:middle;fill:#59636e}.ns{font-size:12px;text-anchor:middle;fill:#59636e}.el{font-size:11.5px;font-style:italic;stroke-width:4px;stroke-linejoin:round;paint-order:stroke}</style><defs><marker id="ah-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#818b98"/></marker><marker id="ah-build" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#4f6bd8"/></marker><marker id="ah-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#d08a1e"/></marker><marker id="ah-hw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#2f9b62"/></marker><marker id="ah-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#d08a1e"/></marker><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#8c959f"/></marker><marker id="ah-decide" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#8b5cf6"/></marker><marker id="ah-future" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#8c959f"/></marker><marker id="ah-note" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#afb8c1"/></marker></defs><rect x="16" y="16" width="880" height="176" rx="14" fill="#f0f8f3" stroke="#cde7d6"/><text x="36" y="44" class="pt">Pipeline: one layer group per board</text><rect x="16" y="208" width="880" height="248" rx="14" fill="#f3f6fd" stroke="#d5def3"/><text x="36" y="236" class="pt">Split layer: every board holds a slice of every layer</text><path d="M226 84 L262 84" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M442 84 L478 84" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M658 84 L694 84" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M456 296 L456 318 Q456 326 448 326 L144 326 Q136 326 136 334 L136 356" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M136 396 L136 420" fill="none" stroke="#818b98" stroke-width="1.5"/><path d="M456 296 L456 318 Q456 326 448 326 L360 326 Q352 326 352 334 L352 356" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M352 396 L352 420" fill="none" stroke="#818b98" stroke-width="1.5"/><path d="M456 296 L456 318 Q456 326 464 326 L560 326 Q568 326 568 334 L568 356" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M568 396 L568 420" fill="none" stroke="#818b98" stroke-width="1.5"/><path d="M456 296 L456 318 Q456 326 464 326 L776 326 Q784 326 784 334 L784 356" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M784 396 L784 420" fill="none" stroke="#818b98" stroke-width="1.5"/><path d="M136 420 L858 420 Q866 420 866 412 L866 284 Q866 276 858 276 L626 276" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><g class="n" data-id="p0"><rect x="46" y="64" width="180" height="40" rx="8" fill="#ffffff" stroke="#2f9b62" stroke-width="1.5"/><text x="136" y="88.5" class="nt">Board 1: layers 1-4</text></g><g class="n" data-id="p1"><rect x="262" y="64" width="180" height="40" rx="8" fill="#ffffff" stroke="#2f9b62" stroke-width="1.5"/><text x="352" y="88.5" class="nt">Board 2: layers 5-8</text></g><g class="n" data-id="p2"><rect x="478" y="64" width="180" height="40" rx="8" fill="#ffffff" stroke="#2f9b62" stroke-width="1.5"/><text x="568" y="88.5" class="nt">Board 3: layers 9-12</text></g><g class="n" data-id="p3"><rect x="694" y="64" width="180" height="40" rx="8" fill="#ffffff" stroke="#2f9b62" stroke-width="1.5"/><text x="784" y="88.5" class="nt">Board 4: layers 13-16</text></g><g class="n" data-id="pn"><rect x="236" y="122" width="440" height="58" rx="8" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5" stroke-dasharray="5 4"/><text x="456" y="146.5" class="ni">One token visits boards in turn; others wait.</text><text x="456" y="164.5" class="ni">Adds capacity, not speed.</text></g><g class="n" data-id="co"><rect x="286" y="256" width="340" height="40" rx="8" fill="#ffffff" stroke="#4f6bd8" stroke-width="1.5"/><text x="456" y="280.5" class="nt">Coordinator: input, output, next token</text></g><g class="n" data-id="s0"><rect x="46" y="356" width="180" height="40" rx="8" fill="#ffffff" stroke="#2f9b62" stroke-width="1.5"/><text x="136" y="380.5" class="nt">Board 1: 1/4 neurons</text></g><g class="n" data-id="s1"><rect x="262" y="356" width="180" height="40" rx="8" fill="#ffffff" stroke="#2f9b62" stroke-width="1.5"/><text x="352" y="380.5" class="nt">Board 2: 1/4 neurons</text></g><g class="n" data-id="s2"><rect x="478" y="356" width="180" height="40" rx="8" fill="#ffffff" stroke="#2f9b62" stroke-width="1.5"/><text x="568" y="380.5" class="nt">Board 3: 1/4 neurons</text></g><g class="n" data-id="s3"><rect x="694" y="356" width="180" height="40" rx="8" fill="#ffffff" stroke="#2f9b62" stroke-width="1.5"/><text x="784" y="380.5" class="nt">Board 4: 1/4 neurons</text></g><text x="456" y="440.0" text-anchor="middle" class="el" fill="#59636e" stroke="#f3f6fd">exchange small result vectors, one message per layer</text></svg>
