<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 706" width="960" height="706" role="img" aria-label="How it works. On the PC: BitNetMCU training of a ternary MNIST CNN exports a model header; the compiler front end (compiler/mafc) builds an IR of conv, pool, relu_norm, linear and argmax; bounds.py proves value ranges; the RP2350 back end (2 cores, SMLAD, branch-free ReLU) generates C, which the Pico SDK builds and picotool flashes. An IR interpreter must match the exact-integer golden model, whose expected logits feed harness/run.py and measure.sh, which write results/*.csv and notes/FINDINGS.md. The firmware is the model: on the Pico 2, bare metal, weights are const arrays in flash or SRAM; core 0 takes half the channels then the fc layers and argmax, core 1 the other half, joining core 0. The harness sends an image over USB serial and gets back the prediction, logits and cycle count."><title>How it works. On the PC: BitNetMCU training of a ternary MNIST CNN exports a model header; the compiler front end (compiler/mafc) builds an IR of conv, pool, relu_norm, linear and argmax; bounds.py proves value ranges; the RP2350 back end (2 cores, SMLAD, branch-free ReLU) generates C, which the Pico SDK builds and picotool flashes. An IR interpreter must match the exact-integer golden model, whose expected logits feed harness/run.py and measure.sh, which write results/*.csv and notes/FINDINGS.md. The firmware is the model: on the Pico 2, bare metal, weights are const arrays in flash or SRAM; core 0 takes half the channels then the fc layers and argmax, core 1 the other half, joining core 0. The harness sends an image over USB serial and gets back the prediction, logits and cycle count.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;fill:#1f2328}.pt{font-size:14px;font-weight:700}.ps{font-size:12px;fill:#59636e}.nt{font-size:14px;font-weight:600;text-anchor:middle}.ni{font-size:13px;font-style:italic;text-anchor:middle;fill:#59636e}.ns{font-size:12px;text-anchor:middle;fill:#59636e}.el{font-size:11.5px;font-style:italic;stroke-width:4px;stroke-linejoin:round;paint-order:stroke}</style><defs><marker id="ah-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#818b98"/></marker><marker id="ah-build" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#4f6bd8"/></marker><marker id="ah-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#d08a1e"/></marker><marker id="ah-hw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#2f9b62"/></marker><marker id="ah-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#d08a1e"/></marker><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#8c959f"/></marker><marker id="ah-decide" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#8b5cf6"/></marker><marker id="ah-future" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#8c959f"/></marker><marker id="ah-note" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#afb8c1"/></marker></defs><rect x="16" y="16" width="580" height="650" rx="14" fill="#f3f6fd" stroke="#d5def3"/><text x="36" y="44" class="pt">On the PC</text><rect x="660" y="16" width="284" height="650" rx="14" fill="#f0f8f3" stroke="#cde7d6"/><text x="680" y="44" class="pt">On the Pico 2</text><text x="680" y="61" class="ps">bare metal, no OS</text><path d="M167 123 L167 138" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M167 197 L167 212" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M167 271 L167 286" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M167 345 L167 360" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M167 419 L167 434" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M167 493 L167 508" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M167 567 L167 582" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M298 315.5 L318 315.5" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M449 335.5 L449 378" fill="none" stroke="#818b98" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-edge)"/><path d="M449 453 L449 496" fill="none" stroke="#818b98" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-edge)"/><path d="M449 555 L449 591.5" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M780 135 L780 220" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M904 135 L904 488" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M780 295 L780 488" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M580 514.5 L680 514.5" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M680 536.5 L580 536.5" fill="none" stroke="#818b98" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M167 641 L167 682 Q167 690 175 690 L794 690 Q802 690 802 682 L802 667" fill="none" stroke="#2f9b62" stroke-width="2.2" marker-end="url(#ah-hw)"/><g class="n" data-id="T"><rect x="36" y="64" width="262" height="59" rx="8" fill="#ffffff" stroke="#4f6bd8" stroke-width="1.5"/><text x="167" y="88.5" class="nt">train/: BitNetMCU training</text><text x="167" y="108" class="ns">ternary MNIST CNN</text></g><g class="n" data-id="H"><rect x="36" y="138" width="262" height="59" rx="8" fill="#ffffff" stroke="#4f6bd8" stroke-width="1.5"/><text x="167" y="162.5" class="nt">Exported model header</text><text x="167" y="182" class="ns">train/export/*.h</text></g><g class="n" data-id="FE"><rect x="36" y="212" width="262" height="59" rx="8" fill="#ffffff" stroke="#4f6bd8" stroke-width="1.5"/><text x="167" y="236.5" class="nt">Compiler front end</text><text x="167" y="256" class="ns">compiler/mafc</text></g><g class="n" data-id="IR"><rect x="36" y="286" width="262" height="59" rx="8" fill="#ffffff" stroke="#4f6bd8" stroke-width="1.5"/><text x="167" y="310.5" class="nt">IR</text><text x="167" y="330" class="ns">conv, pool, relu_norm, linear, argmax</text></g><g class="n" data-id="BD"><rect x="36" y="360" width="262" height="59" rx="8" fill="#ffffff" stroke="#4f6bd8" stroke-width="1.5"/><text x="167" y="384.5" class="nt">bounds.py</text><text x="167" y="404" class="ns">proves value ranges (int16 where safe)</text></g><g class="n" data-id="BE"><rect x="36" y="434" width="262" height="59" rx="8" fill="#ffffff" stroke="#4f6bd8" stroke-width="1.5"/><text x="167" y="458.5" class="nt">RP2350 back end</text><text x="167" y="478" class="ns">2 cores, SMLAD, branch-free ReLU</text></g><g class="n" data-id="GEN"><rect x="36" y="508" width="262" height="59" rx="8" fill="#ffffff" stroke="#4f6bd8" stroke-width="1.5"/><text x="167" y="532.5" class="nt">Generated C</text><text x="167" y="552" class="ns">firmware/rp2350/mafc/gen/</text></g><g class="n" data-id="SDK"><rect x="36" y="582" width="262" height="59" rx="8" fill="#ffffff" stroke="#4f6bd8" stroke-width="1.5"/><text x="167" y="616" class="nt">Pico SDK build + picotool flash</text></g><g class="n" data-id="I"><rect x="318" y="295.5" width="262" height="40" rx="8" fill="#fffaf0" stroke="#d08a1e" stroke-width="1.5"/><text x="449" y="320" class="nt">IR interpreter (numpy)</text></g><g class="n" data-id="G"><rect x="318" y="378" width="262" height="75" rx="8" fill="#fffaf0" stroke="#d08a1e" stroke-width="1.5"/><text x="449" y="402.5" class="nt">Golden model</text><text x="449" y="422" class="ns">harness/golden.py</text><text x="449" y="438" class="ns">(exact integer numpy)</text></g><g class="n" data-id="R"><rect x="318" y="496" width="262" height="59" rx="8" fill="#fffaf0" stroke="#d08a1e" stroke-width="1.5"/><text x="449" y="520.5" class="nt">harness/run.py, measure.sh</text><text x="449" y="540" class="ns">send images, check, time</text></g><g class="n" data-id="CSV"><rect x="318" y="591.5" width="262" height="40" rx="8" fill="#fffaf0" stroke="#d08a1e" stroke-width="1.5"/><text x="449" y="616" class="nt">results/*.csv, notes/FINDINGS.md</text></g><g class="n" data-id="MEM"><rect x="680" y="76" width="244" height="59" rx="8" fill="#ffffff" stroke="#2f9b62" stroke-width="1.5"/><text x="802" y="100.5" class="nt">Weights as const arrays</text><text x="802" y="120" class="ns">flash (XIP cache) or SRAM</text></g><g class="n" data-id="C1"><rect x="680" y="220" width="200" height="75" rx="8" fill="#ffffff" stroke="#2f9b62" stroke-width="1.5"/><text x="780" y="244.5" class="nt">Core 1</text><text x="780" y="264" class="ns">other half</text><text x="780" y="280" class="ns">(job loop on SIO FIFO)</text></g><g class="n" data-id="C0"><rect x="680" y="488.0" width="244" height="75" rx="8" fill="#ffffff" stroke="#2f9b62" stroke-width="1.5"/><text x="802" y="512.5" class="nt">Core 0</text><text x="802" y="532" class="ns">half the channels,</text><text x="802" y="548" class="ns">then fc layers, argmax</text></g><text x="459" y="360.5" text-anchor="start" class="el" fill="#59636e" stroke="#f3f6fd">must match</text><text x="459" y="478.0" text-anchor="start" class="el" fill="#59636e" stroke="#f3f6fd">expected logits</text><text x="790" y="395.5" text-anchor="start" class="el" fill="#59636e" stroke="#f0f8f3">join</text><text x="630" y="489.5" text-anchor="middle" class="el" fill="#59636e" stroke="#ffffff">image over</text><text x="630" y="504.0" text-anchor="middle" class="el" fill="#59636e" stroke="#ffffff">USB serial</text><text x="630" y="554.5" text-anchor="middle" class="el" fill="#59636e" stroke="#ffffff">prediction, logits,</text><text x="630" y="569.0" text-anchor="middle" class="el" fill="#59636e" stroke="#ffffff">cycle count</text><text x="628" y="684.0" text-anchor="middle" class="el" fill="#2f9b62" stroke="#ffffff">firmware = the model</text></svg>
