<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 232" width="852" height="232" role="img" aria-label="Inside one layer: B, a tree search, makes a few yes/no decisions to pick one branch; C, DMA streams that branch&#x27;s weights from flash while the core computes; only that branch is computed; D asks whether the answer is confident: if yes, answer now and skip the remaining layers, if no, go to the next layer."><title>Inside one layer: B, a tree search, makes a few yes/no decisions to pick one branch; C, DMA streams that branch&#x27;s weights from flash while the core computes; only that branch is computed; D asks whether the answer is confident: if yes, answer now and skip the remaining layers, if no, go to the next layer.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;fill:#e6edf3}.pt{font-size:14px;font-weight:700}.ps{font-size:12px;fill:#9198a1}.nt{font-size:14px;font-weight:600;text-anchor:middle}.ni{font-size:13px;font-style:italic;text-anchor:middle;fill:#9198a1}.ns{font-size:12px;text-anchor:middle;fill:#9198a1}.el{font-size:11.5px;font-style:italic;stroke-width:4px;stroke-linejoin:round;paint-order:stroke}</style><defs><marker id="ah-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#7d8590"/></marker><marker id="ah-build" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#7d95f0"/></marker><marker id="ah-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#e9a94a"/></marker><marker id="ah-hw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#4cc488"/></marker><marker id="ah-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#e9a94a"/></marker><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#8b949e"/></marker><marker id="ah-decide" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#a78bfa"/></marker><marker id="ah-future" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#8b949e"/></marker><marker id="ah-note" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#3d444d"/></marker></defs><path d="M156 53.5 L196 53.5" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M466 53.5 L506 53.5" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M671 83 L671 106 Q671 114 663 114 L114 114 Q106 114 106 122 L106 145" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M196 165 L236 165" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M386 165 L422 165 Q430 165 430 157 L430 143 Q430 135 438 135 L486 135" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M386 165 L422 165 Q430 165 430 173 L430 187 Q430 195 438 195 L486 195" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><g class="n" data-id="IN"><rect x="16" y="24" width="140" height="59" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/><text x="86" y="58" class="nt">Layer input</text></g><g class="n" data-id="B"><rect x="196" y="24" width="270" height="59" rx="8" fill="#161f36" stroke="#7d95f0" stroke-width="1.5"/><text x="331" y="48.5" class="nt">B: tree search</text><text x="331" y="68" class="ns">a few yes/no decisions pick one branch</text></g><g class="n" data-id="C"><rect x="506" y="24" width="330" height="59" rx="8" fill="#2a2113" stroke="#e9a94a" stroke-width="1.5"/><text x="671" y="48.5" class="nt">C: DMA streams that branch&#x27;s weights</text><text x="671" y="68" class="ns">from flash while the core computes</text></g><g class="n" data-id="CMP"><rect x="16" y="145" width="180" height="40" rx="8" fill="#122a1f" stroke="#4cc488" stroke-width="1.5"/><text x="106" y="169.5" class="nt">Compute branch only</text></g><g class="n" data-id="D"><rect x="236" y="145" width="150" height="40" rx="20" fill="#221a38" stroke="#a78bfa" stroke-width="1.5"/><text x="311" y="169.5" class="nt">D: confident?</text></g><g class="n" data-id="OUT"><rect x="486" y="115" width="290" height="40" rx="8" fill="#122a1f" stroke="#4cc488" stroke-width="1.5"/><text x="631" y="139.5" class="nt">Answer now, skip remaining layers</text></g><g class="n" data-id="NEXT"><rect x="486" y="175" width="290" height="40" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/><text x="631" y="199.5" class="nt">Next layer</text></g><text x="458" y="128.0" text-anchor="middle" class="el" fill="#9198a1" stroke="#0d1117">yes</text><text x="458" y="213.0" text-anchor="middle" class="el" fill="#9198a1" stroke="#0d1117">no</text></svg>
