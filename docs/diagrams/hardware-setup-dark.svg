<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 866 376" width="866" height="376" role="img" aria-label="Hardware setup. The PC or laptop (build and test harness) connects over USB to the Debug Probe (CMSIS-DAP), which reaches Pico 2 #1, the target, by an SWD cable (3-pin JST) and a UART cable. The PC also powers and flashes the Pico over USB, through a USB power meter (mWh). Later, for idea F, Pico 2 #2 and #3 join with jumper wires in a star layout."><title>Hardware setup. The PC or laptop (build and test harness) connects over USB to the Debug Probe (CMSIS-DAP), which reaches Pico 2 #1, the target, by an SWD cable (3-pin JST) and a UART cable. The PC also powers and flashes the Pico over USB, through a USB power meter (mWh). Later, for idea F, Pico 2 #2 and #3 join with jumper wires in a star layout.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;fill:#e6edf3}.pt{font-size:14px;font-weight:700}.ps{font-size:12px;fill:#9198a1}.nt{font-size:14px;font-weight:600;text-anchor:middle}.ni{font-size:13px;font-style:italic;text-anchor:middle;fill:#9198a1}.ns{font-size:12px;text-anchor:middle;fill:#9198a1}.el{font-size:11.5px;font-style:italic;stroke-width:4px;stroke-linejoin:round;paint-order:stroke}</style><defs><marker id="ah-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#7d8590"/></marker><marker id="ah-build" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#7d95f0"/></marker><marker id="ah-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#e9a94a"/></marker><marker id="ah-hw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#4cc488"/></marker><marker id="ah-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#e9a94a"/></marker><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#8b949e"/></marker><marker id="ah-decide" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#a78bfa"/></marker><marker id="ah-future" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#8b949e"/></marker><marker id="ah-note" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#3d444d"/></marker></defs><path d="M106 146 L106 73.5 Q106 65.5 114 65.5 L336 65.5" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M516 52.52 L793 52.5006 Q801 52.5 801.068 60.4997 L801.8 146" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M516 78.48 L713 78.4992 Q721 78.5 720.905 86.4994 L720.2 146" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M196 163.7 L676 163.7" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M196 188.48 L676 188.48" fill="none" stroke="#7d8590" stroke-width="1.5"/><path d="M761 205 L761 316" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/><g class="n" data-id="PC"><rect x="16" y="146" width="180" height="59" rx="8" fill="#161f36" stroke="#7d95f0" stroke-width="1.5"/><text x="106" y="170.5" class="nt">PC / laptop</text><text x="106" y="190" class="ns">build + test harness</text></g><g class="n" data-id="DP"><rect x="336" y="36" width="180" height="59" rx="8" fill="#2a2113" stroke="#e9a94a" stroke-width="1.5"/><text x="426" y="60.5" class="nt">Debug Probe</text><text x="426" y="80" class="ns">(CMSIS-DAP)</text></g><g class="n" data-id="P2"><rect x="676" y="146" width="170" height="59" rx="8" fill="#122a1f" stroke="#4cc488" stroke-width="1.5"/><text x="761" y="170.5" class="nt">Pico 2 #1</text><text x="761" y="190" class="ns">target</text></g><g class="n" data-id="P3"><rect x="676" y="316" width="170" height="40" rx="8" fill="#0d1117" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 4"/><text x="761" y="340.5" class="nt">Pico 2 #2, #3</text></g><text x="221" y="57.5" text-anchor="middle" class="el" fill="#9198a1" stroke="#0d1117">USB</text><text x="610" y="24.0" text-anchor="middle" class="el" fill="#9198a1" stroke="#0d1117">SWD cable</text><text x="610" y="38.5" text-anchor="middle" class="el" fill="#9198a1" stroke="#0d1117">(3-pin JST)</text><text x="610" y="97.0" text-anchor="middle" class="el" fill="#9198a1" stroke="#0d1117">UART cable</text><text x="436" y="142.0" text-anchor="middle" class="el" fill="#9198a1" stroke="#0d1117">USB</text><text x="436" y="156.5" text-anchor="middle" class="el" fill="#9198a1" stroke="#0d1117">power + flashing</text><text x="436" y="206.0" text-anchor="middle" class="el" fill="#9198a1" stroke="#0d1117">USB power meter</text><text x="436" y="220.5" text-anchor="middle" class="el" fill="#9198a1" stroke="#0d1117">(mWh)</text><text x="749" y="262.0" text-anchor="end" class="el" fill="#9198a1" stroke="#0d1117">idea F later:</text><text x="749" y="276.5" text-anchor="end" class="el" fill="#9198a1" stroke="#0d1117">jumper wires, star layout</text></svg>
