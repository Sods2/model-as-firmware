<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 936 450" width="936" height="450" role="img" aria-label="Build time, on the PC: train a ternary model in PyTorch; the model compiler (Python) emits code per layer with fixed addresses and a core split; the result is a .uf2 firmware image, flashed over USB or the Debug Probe. Run time, on the board with no OS: input via UART or USB goes to core 0 (first half of layers), activations pass via SRAM to core 1 (second half), DMA sends the result out as output, which the PC test harness compares with PyTorch."><title>Build time, on the PC: train a ternary model in PyTorch; the model compiler (Python) emits code per layer with fixed addresses and a core split; the result is a .uf2 firmware image, flashed over USB or the Debug Probe. Run time, on the board with no OS: input via UART or USB goes to core 0 (first half of layers), activations pass via SRAM to core 1 (second half), DMA sends the result out as output, which the PC test harness compares with PyTorch.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;fill:#e6edf3}.pt{font-size:14px;font-weight:700}.ps{font-size:12px;fill:#9198a1}.nt{font-size:14px;font-weight:600;text-anchor:middle}.ni{font-size:13px;font-style:italic;text-anchor:middle;fill:#9198a1}.ns{font-size:12px;text-anchor:middle;fill:#9198a1}.el{font-size:11.5px;font-style:italic;stroke-width:4px;stroke-linejoin:round;paint-order:stroke}</style><defs><marker id="ah-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#7d8590"/></marker><marker id="ah-build" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#7d95f0"/></marker><marker id="ah-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#e9a94a"/></marker><marker id="ah-hw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#4cc488"/></marker><marker id="ah-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#e9a94a"/></marker><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#8b949e"/></marker><marker id="ah-decide" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#a78bfa"/></marker><marker id="ah-future" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#8b949e"/></marker><marker id="ah-note" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#3d444d"/></marker></defs><rect x="16" y="16" width="888" height="130" rx="14" fill="#121a2c" stroke="#2a3757"/><text x="36" y="44" class="pt">Build time - on the PC</text><rect x="16" y="212" width="888" height="130" rx="14" fill="#0f1f18" stroke="#24483a"/><text x="36" y="240" class="pt">Run time - on the board, no OS</text><path d="M246 95.5 L296 95.5" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M596 95.5 L646 95.5" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M176 291 L212 291" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M362 291 L502 291" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M632 291 L666 291" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M786 291 L816 291" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M741 125 L741 212" fill="none" stroke="#4cc488" stroke-width="2.2" marker-end="url(#ah-hw)"/><path d="M851 320 L851 392" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><g class="n" data-id="tr"><rect x="46" y="66" width="200" height="59" rx="8" fill="#161f36" stroke="#7d95f0" stroke-width="1.5"/><text x="146" y="91" class="nt">Train ternary model</text><text x="146" y="109" class="nt">in PyTorch</text></g><g class="n" data-id="cp"><rect x="296" y="66" width="300" height="59" rx="8" fill="#161f36" stroke="#7d95f0" stroke-width="1.5"/><text x="446" y="90.5" class="nt">Model compiler (Python)</text><text x="446" y="110" class="ns">code per layer, fixed addresses, core split</text></g><g class="n" data-id="fw"><rect x="646" y="66" width="190" height="59" rx="8" fill="#122a1f" stroke="#4cc488" stroke-width="1.5"/><text x="741" y="100" class="nt">Firmware image .uf2</text></g><g class="n" data-id="in"><rect x="46" y="262" width="130" height="58" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/><text x="111" y="286.5" class="nt">Input via</text><text x="111" y="304.5" class="nt">UART / USB</text></g><g class="n" data-id="c0"><rect x="212" y="262" width="150" height="58" rx="8" fill="#122a1f" stroke="#4cc488" stroke-width="1.5"/><text x="287" y="286.5" class="nt">Core 0: first</text><text x="287" y="304.5" class="nt">half of layers</text></g><g class="n" data-id="c1"><rect x="502" y="262" width="130" height="58" rx="8" fill="#122a1f" stroke="#4cc488" stroke-width="1.5"/><text x="567" y="286.5" class="nt">Core 1:</text><text x="567" y="304.5" class="nt">second half</text></g><g class="n" data-id="dma"><rect x="666" y="262" width=