<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 916 374" width="916" height="374" role="img" aria-label="Larger-than-SRAM loop: the router or tree picks the next block; if it is in the SRAM cache (hit), compute from the 520 KB SRAM; on a miss, do an aligned block read from QSPI flash (4-16 MB) or PSRAM (8 MB) into the SRAM working-set cache, then compute. A prefetch of the most likely next block via DMA fills the cache ahead of time. Compute then goes back to the router."><title>Larger-than-SRAM loop: the router or tree picks the next block; if it is in the SRAM cache (hit), compute from the 520 KB SRAM; on a miss, do an aligned block read from QSPI flash (4-16 MB) or PSRAM (8 MB) into the SRAM working-set cache, then compute. A prefetch of the most likely next block via DMA fills the cache ahead of time. Compute then goes back to the router.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;fill:#e6edf3}.pt{font-size:14px;font-weight:700}.ps{font-size:12px;fill:#9198a1}.nt{font-size:14px;font-weight:600;text-anchor:middle}.ni{font-size:13px;font-style:italic;text-anchor:middle;fill:#9198a1}.ns{font-size:12px;text-anchor:middle;fill:#9198a1}.el{font-size:11.5px;font-style:italic;stroke-width:4px;stroke-linejoin:round;paint-order:stroke}</style><defs><marker id="ah-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#7d8590"/></marker><marker id="ah-build" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#7d95f0"/></marker><marker id="ah-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#e9a94a"/></marker><marker id="ah-hw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#4cc488"/></marker><marker id="ah-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#e9a94a"/></marker><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#8b949e"/></marker><marker id="ah-decide" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#a78bfa"/></marker><marker id="ah-future" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#8b949e"/></marker><marker id="ah-note" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#3d444d"/></marker></defs><path d="M206 151 L246 151" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M406 151 L422 151 Q430 151 430 143 L430 74 Q430 66 438 66 L640 66" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M406 151 L422 151 Q430 151 430 159 L430 221.5 Q430 229.5 438 229.5 L456 229.5" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M676 229.5 L700 229.5" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M795 210 L795 86" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><path d="M795 300 L795 250" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-edge)"/><path d="M700 46 L700 28 Q700 20 692 20 L119 20 Q111 20 111 28 L111 122" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#ah-edge)"/><g class="n" data-id="R"><rect x="16" y="122" width="190" height="58" rx="8" fill="#161f36" stroke="#7d95f0" stroke-width="1.5"/><text x="111" y="146.5" class="nt">Router / tree picks</text><text x="111" y="164.5" class="nt">next block</text></g><g class="n" data-id="Q"><rect x="246" y="131" width="160" height="40" rx="20" fill="#221a38" stroke="#a78bfa" stroke-width="1.5"/><text x="326" y="155.5" class="nt">In SRAM cache?</text></g><g class="n" data-id="CMP"><rect x="640" y="46" width="250" height="40" rx="8" fill="#122a1f" stroke="#4cc488" stroke-width="1.5"/><text x="765" y="70.5" class="nt">Compute from SRAM 520 KB</text></g><g class="n" data-id="RD"><rect x="456" y="200" width="220" height="59" rx="8" fill="#2a2113" stroke="#e9a94a" stroke-width="1.5"/><text x="566" y="224.5" class="nt">Aligned block read</text><text x="566" y="244" class="ns">QSPI flash 4-16 MB or PSRAM 8 MB</text></g><g class="n" data-id="CACHE"><rect x="700" y="210" width="190" height="40" rx="8" fill="#122a1f" stroke="#4cc488" stroke-width="1.5"/><text x="795" y="234.5" class="nt">SRAM working-set cache</text></g><g class="n" data-id="PF"><rect x="690" y="300" width="210" height="58" rx="8" fill="#161f36" stroke="#7d95f0" stroke-width="1.5"/><text x="795" y="324.5" class="nt">Prefetch most likely</text><text x="795" y="342.5" class="nt">next block via DMA</text></g><text x="440" y="112.0" text-anchor="start" class="el" fill="#9198a1" stroke="#0d1117">hit</text><text x="440" y="196.0" text-anchor="start" class="el" fill="#9198a1" stroke="#0d1117">miss</text></svg>
